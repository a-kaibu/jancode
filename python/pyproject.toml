[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "jancode"
version = "2.0.0"
description = "Validate, encode and render JAN (EAN-8 / EAN-13) barcodes as SVG"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "kota", email = "52403688+yashikota@users.noreply.github.com" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["jancode", "ean", "barcode", "svg"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/yashikota/jancode"

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
strict = true
files = ["jancode"]
